<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Inside Your Computer</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#app{position:relative;width:100%;height:100%;background:#000}
canvas{display:block;width:100%;height:100%;background:#000;image-rendering:pixelated;image-rendering:crisp-edges}
#controls{position:absolute;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));display:flex;gap:8px;z-index:10;opacity:.72;transition:opacity .6s ease}
#controls.dimmed{opacity:.12}
button{appearance:none;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.68);color:#fff;min-width:78px;min-height:44px;padding:8px 14px;border-radius:6px;font-weight:700;letter-spacing:.04em}
#message{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);max-width:min(92vw,700px);padding:8px 12px;border-radius:6px;background:rgba(0,0,0,.66);text-align:center;font-size:14px;opacity:1;transition:opacity .8s ease;pointer-events:none}
#message.hidden{opacity:0}
@media(prefers-reduced-motion:reduce){#controls,#message{transition:none}}
</style>
</head>

</div>
<div id="message">Tap once to enable sound. STOP exits the animation.</div>

const sounds={};
for(let i=1;i<=8;i++){const a=new Audio(SOUND_ASSETS[`sound${i}.wav`]);a.preload="auto";sounds[i]=a;}
function framePath(id,n){return SPRITE_ASSETS[`sprite_${id}_${String(n).padStart(2,"0")}.png`];}
function frames(id){return Array.from({length:12},(_,n)=>{const i=new Image();i.src=framePath(id,n);return i;});}
const actors=[
{id:8802,delay:2,dx:1,dy:1,sound:1,x:-120,y:45,tick:0,frame:0,frames:frames(8802)},
{id:8803,delay:1,dx:1,dy:-1,sound:2,x:120,y:460,tick:0,frame:0,frames:frames(8803)},

function resize(){const dpr=Math.max(1,Math.min(devicePixelRatio||1,2)),w=innerWidth,h=innerHeight;canvas.width=Math.max(1,Math.round(w*dpr));canvas.height=Math.max(1,Math.round(h*dpr));logicalWidth=LOGICAL_HEIGHT*(w/h);ctx.imageSmoothingEnabled=false;}
function stopAudio(){if(currentAudio){try{currentAudio.pause();currentAudio.currentTime=0}catch(e){}}currentAudio=null;}
function playSound(n){if(!soundEnabled||!audioUnlocked)return;const now=performance.now();if(currentAudio&&!currentAudio.paused&&!currentAudio.ended)return;if(lastAnySoundAt&&now-lastAnySoundAt<MIN_SOUND_GAP)return;const same=lastSoundAt.get(n);if(same&&now-same<SAME_SOUND_GAP)return;const a=sounds[n];if(!a)return;try{a.currentTime=0;a.volume=.85;currentAudio=a;const p=a.play();if(p&&p.catch)p.catch(()=>{});lastAnySoundAt=now;lastSoundAt.set(n,now)}catch(e){}}
function unlockAudio(){audioUnlocked=true;message.classList.add("hidden");}
function advance(){if(!running)return;globalTick++;pacingTick++;if(pacingTick%MOVE_DIVISOR===0){for(const a of actors){a.tick++;if(a.tick<a.delay)continue;a.tick=0;a.x+=a.dx;a.y+=a.dy;a.frame=(a.frame+1)%a.frames.length;const img=a.frames[a.frame],iw=img.naturalWidth||64,ih=img.naturalHeight||64,margin=Math.max(iw,ih)+30;let wrapped=false;if(a.x>logicalWidth+margin){a.x=-iw;wrapped=true}else if(a.x<-iw-margin){a.x=logicalWidth+10;wrapped=true}if(a.y>LOGICAL_HEIGHT+margin){a.y=-ih;wrapped=true}else if(a.y<-ih-margin){a.y=LOGICAL_HEIGHT+10;wrapped=true}if(wrapped)playSound(a.sound);}}
if(globalTick>=nextAmbientSoundTick){playSound(nextAmbientSoundNumber);nextAmbientSoundNumber++;if(nextAmbientSoundNumber>8)nextAmbientSoundNumber=1;nextAmbientSoundTick=globalTick+96+Math.floor(Math.random()*49);}}
function render(){if(!running)return;const w=canvas.width,h=canvas.height;ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle="#000";ctx.fillRect(0,0,w,h);const scale=h/LOGICAL_HEIGHT;ctx.setTransform(scale,0,0,scale,0,0);ctx.imageSmoothingEnabled=false;if(board.complete&&board.naturalWidth){for(let y=0;y<LOGICAL_HEIGHT;y+=board.naturalHeight){for(let x=0;x<logicalWidth;x+=board.naturalWidth){ctx.drawImage(board,x,y);}}}for(const a of actors){const img=a.frames[a.frame];if(!img.complete||!img.naturalWidth)continue;const y=LOGICAL_HEIGHT-a.y-img.naturalHeight;ctx.drawImage(img,a.x,y);}requestAnimationFrame(render);}
function reveal(){controls.classList.remove("dimmed");if(controlTimer)clearTimeout(controlTimer);controlTimer=setTimeout(()=>controls.classList.add("dimmed"),3200);}
function stop(){running=false;stopAudio();controls.classList.remove("dimmed");stopBtn.textContent="STOPPED";stopBtn.disabled=true;message.textContent="Animation stopped. Reload the page to start again.";message.classList.remove("hidden");}
soundBtn.addEventListener("click",e=>{e.stopPropagation();unlockAudio();soundEnabled=!soundEnabled;if(!soundEnabled)stopAudio();soundBtn.textContent=soundEnabled?"SOUND ON":"SOUND OFF";reveal();});
stopBtn.addEventListener("click",e=>{e.stopPropagation();stop();});
document.getElementById("app").addEventListener("pointerdown",()=>{unlockAudio();reveal();});
window.addEventListener("resize",resize);window.addEventListener("orientationchange",resize);document.addEventListener("visibilitychange",()=>{if(document.hidden)stopAudio();});
